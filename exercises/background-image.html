<!DOCTYPE html>
<html>
<head>
<style>
.parent {
width: 1000px;
height: 1000px;
background-color: green;
}
.bg-class { 
  background-image: url('../images/cartoon1.jpg');
  width: 800px;
  height: 800px;

  border-top: 2px solid red;
  border-bottom: 2px dotted red;
}

</style>
</head>
<body>

<h1>The background-position Property</h1>
<p>Here, the background image will be positioned in the center of the element (in this case, the body element).</p>
<div class="parent">
	<div class="bg-class"></div>
</div>

</body>
</html>
